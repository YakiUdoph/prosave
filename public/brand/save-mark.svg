<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Teal/Cyan Gradient for Flow -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#00D8F6" />
    </linearGradient>
    <!-- Green/Cyan Gradient for Shield boundary -->
    <linearGradient id="shieldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34C759" />
      <stop offset="100%" stop-color="#00D8F6" />
    </linearGradient>
    <!-- Subtle glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Shield Outline -->
  <path d="M50 8C65 8 82 18 82 40C82 66 50 90 50 90C50 90 18 66 18 40C18 18 35 8 50 8Z" 
        stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.35" />

  <!-- S-Shaped Financial Flow Core -->
  <path d="M50 20 C62 20 70 28 62 42 C54 56 46 54 38 68 C30 82 38 80 50 80" 
        stroke="url(#flowGrad)" stroke-width="6.5" stroke-linecap="round" filter="url(#glow)" />
        
  <!-- Liquidity-Routing Nodes & Connections -->
  <!-- Top Node -->
  <circle cx="50" cy="20" r="3.5" fill="#00F2FE" />
  <line x1="50" y1="20" x2="30" y2="40" stroke="#00D8F6" stroke-width="1" opacity="0.5" />
  <line x1="50" y1="20" x2="70" y2="40" stroke="#00D8F6" stroke-width="1" opacity="0.5" />
  
  <!-- Side Nodes -->
  <circle cx="30" cy="40" r="3" fill="#00D8F6" />
  <circle cx="70" cy="40" r="3" fill="#00D8F6" />
  <line x1="30" y1="40" x2="50" y2="50" stroke="#00D8F6" stroke-width="1" opacity="0.5" />
  <line x1="70" y1="40" x2="50" y2="50" stroke="#00D8F6" stroke-width="1" opacity="0.5" />

  <!-- Center Pivot Node -->
  <circle cx="50" cy="50" r="4.5" fill="#34C759" filter="url(#glow)" />
  <line x1="50" y1="50" x2="30" y2="60" stroke="#34C759" stroke-width="1" opacity="0.5" />
  <line x1="50" y1="50" x2="70" y2="60" stroke="#34C759" stroke-width="1" opacity="0.5" />
  
  <!-- Bottom Side Nodes -->
  <circle cx="30" cy="60" r="3" fill="#34C759" />
  <circle cx="70" cy="60" r="3" fill="#34C759" />
  <line x1="30" y1="60" x2="50" y2="80" stroke="#34C759" stroke-width="1" opacity="0.5" />
  <line x1="70" y1="60" x2="50" y2="80" stroke="#34C759" stroke-width="1" opacity="0.5" />

  <!-- Bottom Node -->
  <circle cx="50" cy="80" r="3.5" fill="#34C759" />
</svg>
